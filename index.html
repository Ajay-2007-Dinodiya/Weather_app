<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            padding: 20px;
        }

        .weather-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #222;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        .search-box input:focus {
            border-color: #4facfe;
        }

        .search-box button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #4facfe;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: #2389e8;
        }

        .weather-card {
            display: none;
        }

        .city {
            font-size: 28px;
            font-weight: bold;
            color: #222;
        }

        .country {
            color: #777;
            margin-top: 5px;
        }

        .weather-icon {
            font-size: 70px;
            margin: 15px 0;
        }

        .temperature {
            font-size: 55px;
            font-weight: bold;
            color: #222;
        }

        .description {
            font-size: 20px;
            text-transform: capitalize;
            color: #555;
            margin: 10px 0 25px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            background: #f3f7fa;
            padding: 15px;
            border-radius: 12px;
        }

        .detail span {
            display: block;
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

        .detail strong {
            font-size: 18px;
            color: #222;
        }

        .error {
            display: none;
            color: #e63946;
            margin-top: 10px;
            font-weight: bold;
        }

        .loading {
            display: none;
            color: #555;
            margin-top: 10px;
        }

        @media (max-width: 500px) {
            .weather-container {
                padding: 20px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="weather-container">

        <h1>🌤️ Weather App</h1>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button onclick="getWeather()">
                Search
            </button>
        </div>

        <div class="loading" id="loading">
            Loading weather...
        </div>

        <div class="error" id="error">
            City not found. Please try again.
        </div>

        <div class="weather-card" id="weatherCard">

            <div class="city" id="cityName">
                Delhi
            </div>

            <div class="country" id="country">
                India
            </div>

            <div class="weather-icon" id="weatherIcon">
                ☀️
            </div>

            <div class="temperature" id="temperature">
                25°C
            </div>

            <div class="description" id="description">
                Clear Sky
            </div>

            <div class="weather-details">

                <div class="detail">
                    <span>💧 Humidity</span>
                    <strong id="humidity">60%</strong>
                </div>

                <div class="detail">
                    <span>💨 Wind Speed</span>
                    <strong id="wind">5 m/s</strong>
                </div>

                <div class="detail">
                    <span>🌡️ Feels Like</span>
                    <strong id="feelsLike">26°C</strong>
                </div>

                <div class="detail">
                    <span>🌡️ Pressure</span>
                    <strong id="pressure">1012 hPa</strong>
                </div>

            </div>

        </div>

    </div>


    <script>

        // ==========================================
        // OPENWEATHERMAP API KEY
        // ==========================================

        const API_KEY = "YOUR_API_KEY";


        // ==========================================
        // GET WEATHER
        // ==========================================

        async function getWeather() {

            const city = document.getElementById("cityInput").value.trim();

            const weatherCard = document.getElementById("weatherCard");
            const error = document.getElementById("error");
            const loading = document.getElementById("loading");

            // Check empty input
            if (city === "") {
                error.innerText = "Please enter a city name.";
                error.style.display = "block";
                weatherCard.style.display = "none";
                return;
            }

            // Show loading
            loading.style.display = "block";
            error.style.display = "none";
            weatherCard.style.display = "none";


            try {

                const url =
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;

                const response = await fetch(url);

                // City not found
                if (!response.ok) {
                    throw new Error("City not found");
                }

                const data = await response.json();


                // ==========================================
                // DISPLAY DATA
                // ==========================================

                document.getElementById("cityName").innerText =
                    data.name;

                document.getElementById("country").innerText =
                    data.sys.country;

                document.getElementById("temperature").innerText =
                    `${Math.round(data.main.temp)}°C`;

                document.getElementById("description").innerText =
                    data.weather[0].description;

                document.getElementById("humidity").innerText =
                    `${data.main.humidity}%`;

                document.getElementById("wind").innerText =
                    `${data.wind.speed} m/s`;

                document.getElementById("feelsLike").innerText =
                    `${Math.round(data.main.feels_like)}°C`;

                document.getElementById("pressure").innerText =
                    `${data.main.pressure} hPa`;


                // ==========================================
                // WEATHER ICON
                // ==========================================

                const weather = data.weather[0].main;

                let icon = "🌤️";

                if (weather === "Clear") {
                    icon = "☀️";
                }

                else if (weather === "Clouds") {
                    icon = "☁️";
                }

                else if (weather === "Rain") {
                    icon = "🌧️";
                }

                else if (weather === "Drizzle") {
                    icon = "🌦️";
                }

                else if (weather === "Thunderstorm") {
                    icon = "⛈️";
                }

                else if (weather === "Snow") {
                    icon = "❄️";
                }

                else if (weather === "Mist" ||
                         weather === "Fog" ||
                         weather === "Haze") {
                    icon = "🌫️";
                }

                document.getElementById("weatherIcon").innerText = icon;


                // Show weather card
                weatherCard.style.display = "block";

            }

            catch (err) {

                error.innerText =
                    "City not found. Please enter a valid city.";

                error.style.display = "block";

                weatherCard.style.display = "none";
            }

            finally {

                loading.style.display = "none";
            }
        }


        // ==========================================
        // ENTER KEY SEARCH
        // ==========================================

        document
            .getElementById("cityInput")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {
                    getWeather();
                }

            });

    </script>

</body>
</html>
